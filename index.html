
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veg Takeaway POS</title>
  <link rel="manifest" href="./manifest.webmanifest">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font: 16px Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    header {
      background: #166534;
      color: white;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr);
      gap: 20px;
      padding: 20px;
      align-items: start;
    }

    section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      min-width: 0;
    }

    h2 {
      margin-top: 0;
    }

    .menu-toolbar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    /* Search box and dropdown */

    .search-wrapper {
      position: relative;
      width: 100%;
    }

    #product-search {
      width: 100%;
      padding: 14px;
      margin: 0;
      font-size: 18px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
    }

    #product-search:focus {
      border-color: #166534;
      box-shadow: 0 0 0 3px rgba(22, 101, 52, 0.12);
    }

    .product-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      z-index: 1000;
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.16);
      max-height: 320px;
      overflow-y: auto;
      padding: 4px;
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      padding: 11px 12px;
      margin: 0;
      border: none;
      border-radius: 6px;
      background: white;
      color: #172033;
      text-align: left;
      cursor: pointer;
      font-size: 15px;
    }

    .dropdown-item:hover,
    .dropdown-item.selected {
      background: #dcfce7;
    }

    .dropdown-item.selected {
      outline: 2px solid #16a34a;
      outline-offset: -2px;
    }

    .dropdown-code {
      display: inline-block;
      min-width: 45px;
      color: #166534;
      font-weight: bold;
    }

    .dropdown-name {
      flex: 1;
      font-weight: 500;
    }

    .dropdown-price {
      color: #166534;
      font-weight: bold;
      white-space: nowrap;
    }

    .dropdown-empty {
      padding: 14px;
      color: #64748b;
      text-align: center;
    }

    .keyboard-help {
      font-size: 12px;
      color: #64748b;
      margin-top: 6px;
    }

    /* Categories */

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 3px 0 10px;
      scrollbar-width: thin;
    }

    .category {
      background: #e2e8f0;
      color: #172033;
      white-space: nowrap;
      padding: 10px 14px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .category.active {
      background: #166534;
      color: white;
    }

    /* Existing product area */

    .products {
      display: none;
    }

    button {
      padding: 14px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .product {
      background: #dcfce7;
      text-align: left;
      border: 1px solid #bbf7d0;
    }

    .product-name {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .product-price {
      display: block;
      color: #166534;
      font-weight: bold;
    }

    /* Checkout */

    .primary {
      background: #166534;
      color: white;
      width: 100%;
    }

    .secondary {
      background: #e2e8f0;
    }

    .cart-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
      padding: 10px 0;
      gap: 8px;
    }

    input {
      padding: 12px;
      width: 100%;
      font-size: 18px;
      margin: 8px 0 15px;
    }

    .total {
      font-size: 26px;
      font-weight: bold;
    }

    .status {
      font-size: 13px;
    }

    #message,
    #sync-message {
      margin-top: 12px;
    }

    /* Cloud sync */

    .sync-panel {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      padding: 16px;
      margin-top: 20px;
    }

    .sync-panel h3 {
      margin-top: 0;
      color: #166534;
    }

    .sync-panel label {
      display: block;
      font-weight: bold;
      margin-top: 10px;
    }

    #sync-now {
      margin-top: 12px;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 750px) {
      main {
        grid-template-columns: 1fr;
        padding: 10px;
        gap: 10px;
      }

      section {
        padding: 15px;
      }

      header {
        padding: 14px;
      }

      .product-dropdown {
        max-height: 260px;
      }

      .dropdown-item {
        padding: 10px 8px;
        font-size: 13px;
        gap: 6px;
      }

      .dropdown-code {
        min-width: 35px;
      }
    }
  </style>

  <script src="./db.js" defer></script>
  <script src="./app.js" defer></script>
  <script src="./sync.js" defer></script>
</head>

<body>
  <header>
    <strong>VEG TAKEAWAY POS</strong>
    <span id="status" class="status">
      Checking connection...
    </span>
  </header>

  <main>
    <section>
      <h2>Menu</h2>

      <div class="menu-toolbar">

        <!-- Keyboard search -->
        <div class="search-wrapper">
          <input
            id="product-search"
            type="search"
            placeholder="Type 2- or product name..."
            aria-label="Search products"
            aria-controls="product-dropdown"
            aria-expanded="false"
            aria-autocomplete="list"
            role="combobox"
            autocomplete="off"
            spellcheck="false"
          >

          <!-- Dropdown populated by app.js -->
          <div
            id="product-dropdown"
            class="product-dropdown"
            role="listbox"
            aria-label="Matching products"
            hidden
          ></div>
        </div>

        <div class="keyboard-help">
          Type 2- for Dosa | Use ↑ ↓ to select |
          Enter to add | F4 for cash | F8 to complete
        </div>

        <div
          id="categories"
          class="categories"
          aria-label="Product categories"
        ></div>

      </div>

      <!-- Kept for compatibility with current app.js -->
      <div id="products" class="products"></div>
    </section>

    <section>
      <h2>Current Order</h2>

      <div id="cart"></div>

      <p class="total">
        Total: Rs. <span id="total">0.00</span>
      </p>

      <label for="cash">Cash received (Rs.)</label>
      <input
        id="cash"
        type="number"
        min="0"
        step="0.01"
      >

      <p>
        Change: Rs. <span id="change">0.00</span>
      </p>

      <button id="checkout" class="primary">
        Complete Sale
      </button>

      <p id="message" role="status"></p>

      <hr>

      <p>
        Pending cloud sync:
        <strong id="pending">0</strong>
      </p>

      <button id="export" class="secondary">
        Export local sales backup
      </button>

      <!-- Cloud synchronization -->
      <div class="sync-panel">
        <h3>Cloud Synchronization</h3>

        <p id="device-status">
          Checking device registration...
        </p>

        <div id="registration">
          <label for="device-id">
            Cashier PC ID
          </label>

          <input
            id="device-id"
            type="text"
            placeholder="POS-01"
            autocomplete="off"
          >

          <label for="registration-code">
            Registration Code
          </label>

          <input
            id="registration-code"
            type="password"
            placeholder="Enter one-time code"
            autocomplete="off"
          >

          <button
            id="register-device"
            class="primary"
          >
            Register Cashier PC
          </button>
        </div>

        <button
          id="sync-now"
          class="secondary"
        >
          Sync Now
        </button>

        <p id="sync-message" role="status">
          Synchronization not started
        </p>
      </div>
    </section>
  </main>
</body>
</html>
