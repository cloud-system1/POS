
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veg Takeaway POS</title>
  <link rel="manifest" href="./manifest.webmanifest">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font: 16px Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    header {
      background: #166534;
      color: white;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr);
      gap: 20px;
      padding: 20px;
      align-items: start;
    }

    section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      min-width: 0;
    }

    h2 { margin-top: 0; }

    .menu-toolbar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    #product-search {
      width: 100%;
      padding: 13px;
      margin: 0;
      font-size: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 3px 0 10px;
      scrollbar-width: thin;
    }

    .category {
      background: #e2e8f0;
      color: #172033;
      white-space: nowrap;
      padding: 10px 14px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .category.active {
      background: #166534;
      color: white;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 12px;
    }

    button {
      padding: 14px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .product {
      background: #dcfce7;
      text-align: left;
      min-height: 90px;
      border: 1px solid #bbf7d0;
    }

    .product:hover {
      background: #bbf7d0;
    }

    .product-name {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .product-price {
      display: block;
      color: #166534;
      font-weight: bold;
    }

    .primary {
      background: #166534;
      color: white;
      width: 100%;
    }

    .secondary {
      background: #e2e8f0;
    }

    .cart-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
      padding: 10px 0;
      gap: 8px;
    }

    input {
      padding: 12px;
      width: 100%;
      font-size: 18px;
      margin: 8px 0 15px;
    }

    .total {
      font-size: 26px;
      font-weight: bold;
    }

    .status {
      font-size: 13px;
    }

    #message, #sync-message {
      margin-top: 12px;
    }

    .sync-panel {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      padding: 16px;
      margin-top: 20px;
    }

    .sync-panel h3 {
      margin-top: 0;
      color: #166534;
    }

    .sync-panel label {
      display: block;
      font-weight: bold;
      margin-top: 10px;
    }

    #sync-now {
      margin-top: 12px;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 750px) {
      main {
        grid-template-columns: 1fr;
        padding: 10px;
        gap: 10px;
      }

      section {
        padding: 15px;
      }

      .products {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .product {
        padding: 12px;
        min-height: 82px;
      }

      header {
        padding: 14px;
      }
    }
  </style>

  <script src="./db.js" defer></script>
  <script src="./app.js" defer></script>
  <script src="./sync.js" defer></script>
</head>

<body>
  <header>
    <strong>VEG TAKEAWAY POS</strong>
    <span id="status" class="status">
      Checking connection...
    </span>
  </header>

  <main>
    <section>
      <h2>Menu</h2>

      <!-- NEW: PRODUCT SEARCH AND CATEGORIES -->
      <div class="menu-toolbar">
        <input
          id="product-search"
          type="search"
          placeholder="Search food or drinks..."
          aria-label="Search products"
          autocomplete="off"
        >

        <div
          id="categories"
          class="categories"
          aria-label="Product categories"
        ></div>
      </div>

      <div id="products" class="products"></div>
    </section>

    <section>
      <h2>Current Order</h2>

      <div id="cart"></div>

      <p class="total">
        Total: Rs. <span id="total">0.00</span>
      </p>

      <label for="cash">Cash received (Rs.)</label>
      <input
        id="cash"
        type="number"
        min="0"
        step="0.01"
      >

      <p>
        Change: Rs. <span id="change">0.00</span>
      </p>

      <button id="checkout" class="primary">
        Complete Sale
      </button>

      <p id="message" role="status"></p>

      <hr>

      <p>
        Pending cloud sync:
        <strong id="pending">0</strong>
      </p>

      <button id="export" class="secondary">
        Export local sales backup
      </button>

      <!-- CLOUD SYNCHRONIZATION -->
      <div class="sync-panel">
        <h3>Cloud Synchronization</h3>

        <p id="device-status">
          Checking device registration...
        </p>

        <div id="registration">
          <label for="device-id">
            Cashier PC ID
          </label>

          <input
            id="device-id"
            type="text"
            placeholder="POS-01"
            autocomplete="off"
          >

          <label for="registration-code">
            Registration Code
          </label>

          <input
            id="registration-code"
            type="password"
            placeholder="Enter one-time code"
            autocomplete="off"
          >

          <button
            id="register-device"
            class="primary"
          >
            Register Cashier PC
          </button>
        </div>

        <button
          id="sync-now"
          class="secondary"
        >
          Sync Now
        </button>

        <p id="sync-message" role="status">
          Synchronization not started
        </p>
      </div>
    </section>
  </main>
</body>
</html>
