<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Premium POS | Operations</title><style>*{box-sizing:border-box}body{margin:0;background:#080f1d;color:#f8fafc;font:15px system-ui}header,section{padding:22px;background:#111d30;border:1px solid #2a3b54;border-radius:12px}header{border-radius:0}main{max-width:1250px;margin:auto;padding:18px}section{margin:16px 0}button,input,select{font:inherit;padding:10px;border-radius:7px;border:1px solid #526582}button{background:#2563eb;color:white;cursor:pointer}button:disabled{opacity:.5}input,select{background:#0b1628;color:white}label{display:inline-flex;flex-direction:column;gap:5px;margin:6px}a{color:#93c5fd}nav{display:flex;gap:8px;flex-wrap:wrap}table{border-collapse:collapse;width:100%}td,th{padding:12px;text-align:left;border-bottom:1px solid #34445e}th{color:#93c5fd}.scroll{overflow:auto}small,p{color:#b8c7dc}output{overflow-wrap:anywhere}h2{margin-top:0}</style><header><h1>Premium POS</h1><p>Smart Business Management System · Administrator Operations</p><a href="/admin">← Dashboard</a></header><main><p id="notice" role="status">Verifying administrator access…</p><div id="app" hidden><nav id="nav"></nav>
<p id="late-warning" role="status"
style="padding:14px;border-radius:8px;background:#78350f;color:white"
hidden></p><section id="tools"></section><section><h2 id="heading"></h2><button id="refresh">Refresh</button><p id="hint"></p><div id="results" class="scroll"></div></section></div><p><a href="/admin-operations-legacy.html">Advanced management (legacy JSON tools)</a></p><footer>Powered by GTG Solution</footer></main><script>
const $=id=>document.getElementById(id), el=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}, money=n=>n==null?'—':'Rs. '+(Number(n)/100).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2});
async function api(k,method='GET',body){const r=await fetch(k.startsWith('/')?k:'/api/admin/operations/'+k,{method,credentials:'same-origin',cache:'no-store',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Request failed');return d;}
const modules={terminals:'Terminals',cashiers:'Cashiers',settlements:'Settlements','late-sales':'Delayed sales',reconciliation:'EOD reconciliation','cash-movements':'Cash movements',shifts:'Shifts',reports:'Sales reports',categories:'Categories',products:'Products',prices:'Outlet prices'};let current='terminals',seq=0;
function button(text,fn){const b=el('button',text);b.onclick=async()=>{b.disabled=true;try{await fn()}catch(e){$('notice').textContent=e.message}finally{b.disabled=false}};return b}
function field(parent,label,control){const l=el('label',label);l.append(control);parent.append(l);return control}
function select(rows,key,label){const s=el('select');s.add(new Option('Select…',''));rows.forEach(r=>s.add(new Option(label(r),r[key])));return s}
function rupees(v){if(!/^\d+(?:\.\d{1,2})?$/.test(v)||Number(v)>10000000)throw Error('Enter a valid rupee amount with up to two decimal places');return Math.round(Number(v)*100)}
function input(){return el('input')}
function table(parent,rows,cols,actions){const t=el('table'),h=el('tr');cols.forEach(([label])=>h.append(el('th',label)));if(actions)h.append(el('th','Actions'));t.append(h);for(const r of rows){const tr=el('tr');cols.forEach(([,get])=>tr.append(el('td',typeof get==='function'?get(r):r[get]??'—')));if(actions){const td=el('td');actions(r).forEach(b=>td.append(b));tr.append(td)}t.append(tr)}parent.append(rows.length?t:el('p','No records found.'))}
async function mutate(k,m,b){if(!confirm('Confirm this management action?'))return;await api(k,m,b);$('notice').textContent='Saved successfully.';await load()}
const status=r=>Number(r.is_active)===1?'Active':'Inactive';
async function refreshLateWarning(){
  const warning=$('late-warning');
  try{
    const d=await api('late-sales');
    warning.hidden=d.pendingCount===0;
    warning.textContent=d.pendingCount
      ? 'ACTION REQUIRED: '+d.pendingCount+' delayed sale(s) - '+money(d.pendingCents)+'. Open Delayed sales to review.'
      : '';
  }catch{
    warning.hidden=false;
    warning.textContent='Unable to verify delayed sales. Refresh before approving settlements.';
  }
}

async function load(){
  refreshLateWarning();const run=++seq,k=current; $('heading').textContent=modules[k];$('hint').textContent='';$('tools').replaceChildren();$('tools').hidden=true;$('results').textContent='Loading…';try{const d=await api(k);if(run!==seq)return;const p=$('results'), tools=$('tools');p.replaceChildren();
if(k==='terminals'){const [dv,ov]=await Promise.all([api('devices'),api('/api/admin/outlets')]);if(run!==seq)return;tools.hidden=false;tools.append(el('h2','Register a cashier PC'));const code=el('output');tools.append(button('Generate one-time code',async()=>{if(!confirm('Generate a new registration code?'))return;const r=await api('registration-code','POST',{});code.textContent=r.code}),code,el('p','Enter this private code and a unique POS- device ID on the cashier computer. Then refresh this page and assign the registered device below. Codes remain valid until used.'));const dev=field(tools,'Registered device',select(dv.devices.filter(x=>!x.revoked_at&&!d.terminals.some(t=>t.device_id===x.device_id)),'device_id',x=>x.device_id)),out=field(tools,'Outlet',select(ov.outlets.filter(x=>Number(x.is_active)===1),'outlet_id',x=>x.outlet_name)),name=field(tools,'Terminal name',input());tools.append(button('Assign terminal',()=>mutate('terminals','POST',{deviceId:dev.value,outletId:out.value,terminalName:name.value})));table(p,d.terminals,[['Terminal','terminal_name'],['Device','device_id'],['Outlet','outlet_name'],['Status',r=>r.revoked_at?'Revoked':status(r)]],r=>[button(Number(r.is_active)?'Disable':'Enable',()=>mutate(k,'PATCH',{terminalId:r.terminal_id,isActive:Number(r.is_active)?0:1}))]);}
else if(k==='cashiers'){const ov=await api('/api/admin/outlets');if(run!==seq)return;tools.hidden=false;const users=[...new Map(d.cashiers.map(x=>[x.user_id,x])).values()];const u=field(tools,'Cashier',select(users.filter(x=>Number(x.is_active)===1),'user_id',x=>x.username)),o=field(tools,'Outlet',select(ov.outlets.filter(x=>Number(x.is_active)===1),'outlet_id',x=>x.outlet_name));tools.append(button('Assign cashier',()=>mutate('assignments','POST',{userId:u.value,outletId:o.value})));table(p,d.cashiers,[['Name','full_name'],['Username','username'],['Outlet','outlet_name'],['Account',status],['Assignment',r=>Number(r.assignment_active)?'Active':'Inactive']],r=>[button(Number(r.is_active)?'Disable account':'Enable account',()=>mutate(k,'PATCH',{userId:r.user_id,isActive:Number(r.is_active)?0:1}))]);}
else if(k==='settlements'){const rec=await api('reconciliation');if(run!==seq)return;const map=new Map(rec.shifts.map(x=>[x.shift_id,x]));$('hint').textContent=rec.warning;table(p,d.settlements,[['Submitted','submitted_at'],['Cashier',r=>map.get(r.shift_id)?.cashier||r.shift_id],['Outlet',r=>map.get(r.shift_id)?.outlet_code||'—'],['Expected',r=>money(map.get(r.shift_id)?.expected_cents)],['Counted',r=>money(r.counted_cents)],['Variance',r=>money(map.get(r.shift_id)?.variance_cents)],['Status','status'],['Rejection reason','rejection_reason']],r=>r.status==='pending'?[button('Approve',()=>mutate(k,'PATCH',{settlementId:r.settlement_id,status:'approved'})),button('Reject',()=>{const reason=prompt('Reason for rejection:');if(reason?.trim())return mutate(k,'PATCH',{settlementId:r.settlement_id,status:'rejected',reason:reason.trim()})})]:[]);}
else if(k==='late-sales'){
  $('hint').textContent=d.pendingCount
    ? 'ATTENTION: '+d.pendingCount+' unresolved delayed sale(s), totaling '+money(d.pendingCents)
    : 'No unresolved delayed sales. Review history is retained.';

  table(p,d.lateSales,[
    ['Sale ID','sale_id'],
    ['Date','created_at'],
    ['Outlet','outlet_code'],
    ['Terminal','device_id'],
    ['Shift','shift_id'],
    ['Amount',r=>money(r.total_cents)],
    ['Settlement','settlement_status'],
    ['Status','status'],
    ['Reviewed by','reviewer'],
    ['Reviewed at','reviewed_at'],
    ['Review reason','review_reason']
  ],r=>{
    const actions=[
      button('Details',()=>{
        let sale;
        try{sale=JSON.parse(r.payload_json)}
        catch{throw Error('Invalid stored transaction')}

        const details=(sale.items||[]).map(
          i=>String(i.name||i.id)+' x '+i.qty+' = '+money(i.price*i.qty)
        ).join('\n');

        alert(
          'Sale: '+r.sale_id+
          '\nTerminal: '+r.device_id+
          '\nTotal: '+money(r.total_cents)+
          '\n\n'+details
        );
      })
    ];

    if(r.status==='pending'){
      for(const decision of ['approved','rejected']){
        actions.push(button(
          decision==='approved'?'Accept sale':'Reject sale',
          async()=>{
            const reason=prompt(
              decision==='approved'
                ? 'Reason for accepting this genuine sale:'
                : 'Reason for rejecting this transaction:'
            );

            if(reason===null)return;

            if(reason.trim().length<3){
              throw Error('A review reason is required.');
            }

            if(decision==='approved' &&
               r.settlement_status==='approved' &&
               !confirm('This shift was previously approved. Accepting this sale changes its reconciliation totals. Confirm only after checking the accounting impact.')){
              return;
            }

            await mutate('late-sales','PATCH',{
              saleId:r.sale_id,
              status:decision,
              reason:reason.trim()
            });
          }
        ));
      }
    }
    return actions;
  });
}
else if(k==='reconciliation'){ $('hint').textContent=d.warning;table(p,d.shifts,[['Opened','opened_at'],['Outlet','outlet_code'],['Cashier','cashier'],['Opening',r=>money(r.opening_cents)],['Cash sales',r=>money(r.cash_sales_cents)],['Cash in',r=>money(r.cash_in_cents)],['Cash out',r=>money(r.cash_out_cents)],['Expected',r=>money(r.expected_cents)],['Counted',r=>money(r.counted_cents)],['Variance',r=>money(r.variance_cents)],['Status','settlement_status']]);}
else if(k==='cash-movements')table(p,d.movements,[['Date','created_at'],['Type','type'],['Amount',r=>money(r.amount_cents)],['Reason','reason'],['Shift','shift_id']]);
else if(k==='shifts')table(p,d.shifts,[['Opened','opened_at'],['Cashier','username'],['Outlet','outlet_name'],['Device','device_id'],['Opening',r=>money(r.opening_cents)],['Counted',r=>money(r.counted_cents)],['Status','status']]);
else if(k==='reports'){ $('hint').textContent='All-time synchronized sales; not a date-filtered report.';table(p,d.outlets,[['Outlet','outlet_name'],['Sales','sales'],['Revenue',r=>money(r.revenue_cents)]]);table(p,d.cashiers,[['Cashier','username'],['Shifts','shifts']]);}
else if(k==='categories'){tools.hidden=false;const name=field(tools,'Category name',input());tools.append(button('Add category',()=>mutate(k,'POST',{name:name.value})));table(p,d.categories,[['Category code','category_id'],['Category name','name']],r=>[button('Edit',async()=>{const n=prompt('Category name',r.name);if(n!==null)await mutate(k,'PATCH',{categoryId:r.category_id,name:n})})]);}
else if(k==='products'){const c=await api('categories');if(run!==seq)return;tools.hidden=false;let editing=null;const name=field(tools,'Product name',input()),cat=field(tools,'Category',select(c.categories,'category_id',r=>r.name)),price=field(tools,'Selling price (Rs.)',input());price.type='number';price.min='0';price.step='0.01';const active=field(tools,'Status',select([{id:'1',name:'Active'},{id:'0',name:'Inactive'}],'id',r=>r.name));active.value='1';const save=button('Add product',()=>{if(!cat.value||!name.value.trim())throw Error('Enter name and category');const b={name:name.value,categoryId:cat.value,priceCents:rupees(price.value)};return editing?mutate(k,'PATCH',{...b,productId:editing,isActive:Number(active.value)}):mutate(k,'POST',b)});tools.append(save,button('Cancel edit',()=>load()));$('hint').textContent='Changes are saved centrally. Registered cashier terminals refresh the catalogue when the cart is empty, approximately every 30 seconds.';table(p,d.products,[['Product code','product_id'],['Product','name'],['Category','category_name'],['Selling price',r=>money(r.price_cents)],['Status',status]],r=>[button('Edit',()=>{editing=r.product_id;name.value=r.name;cat.value=r.category_id;price.value=(r.price_cents/100).toFixed(2);active.value=String(r.is_active);save.textContent='Save changes';tools.scrollIntoView({block:'start'});name.focus()})]);}
else if(k==='prices'){const [ov,pv]=await Promise.all([api('/api/admin/outlets'),api('products')]);if(run!==seq)return;tools.hidden=false;const o=field(tools,'Outlet',select(ov.outlets,'outlet_id',r=>r.outlet_name)),pr=field(tools,'Product',select(pv.products,'product_id',r=>r.name)),v=field(tools,'Outlet selling price (Rs.)',input());v.type='number';v.min='0';v.step='0.01';tools.append(button('Save outlet price',()=>{if(!o.value||!pr.value)throw Error('Select outlet and product');return mutate(k,'POST',{outletId:o.value,productId:pr.value,priceCents:rupees(v.value)})}));table(p,d.prices,[['Outlet',r=>ov.outlets.find(x=>x.outlet_id===r.outlet_id)?.outlet_name||r.outlet_id],['Product',r=>pv.products.find(x=>x.product_id===r.product_id)?.name||r.product_id],['Selling price',r=>money(r.price_cents)]]);}
else {const rows=d[k]||[];const keys=Object.keys(rows[0]||{});table(p,rows,keys.map(x=>[x,x]));}
}catch(e){if(run===seq)$('results').textContent=e.message}}
function choose(k){current=modules[k]?k:'terminals';location.hash=current;load()}
$('refresh').onclick=load;(async()=>{try{const d=await api('/api/auth/me');if(d.user.role!=='admin')throw Error('Administrator access required');$('notice').textContent='Administrator access verified.';$('app').hidden=false;Object.entries(modules).forEach(([k,v])=>$('nav').append(button(v,()=>choose(k))));choose(location.hash.slice(1))}catch(e){$('notice').textContent=e.message}})();
</script></html>
